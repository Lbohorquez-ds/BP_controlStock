<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Remitos - B-P Sanitarios</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="StyleProductos.css">
  <style>
    body { background: #f3f3f3; color: #111; }
    .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
    h1 { color: #111; text-align: center; font-size: 40px; margin-bottom: 5px; }
    .subtitulo { color: #666; text-align: center; margin-bottom: 30px; font-weight: 400; }
    .card-remitos { background: #1b1b1b; padding: 25px; border-radius: 12px; border: 1px solid #2b2b2b; margin-bottom: 25px; }
    .card-remitos h3 { color: #fff; margin-top: 0; border-bottom: 2px solid #ff2b2b; display: inline-block; padding-bottom: 5px; margin-bottom: 20px; }
    .search-label { color: #fff; font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
    #busquedaRemito { width: 100%; border: 2px solid #ff2b2b; padding: 15px; border-radius: 8px; background-color: #fff !important; color: #000 !important; margin-bottom: 10px; font-size: 16px; }
    .table-container { background: white; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background: #ff2b2b; color: white; padding: 15px; font-size: 13px; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; color: #333 !important; font-size: 14px; }
    .td-cliente { font-weight: bold; color: #000 !important; text-align: left; padding-left: 20px; }
    .btn-view { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .btn-edit { background: #28a745; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    .btn-anular { background: #ffc107; color: #000; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .badge-nro { background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; color: #ff2b2b; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <nav class="nav-custom">
    <div class="nav-links">
      <a href="index.html">INICIO</a>
      <a href="productos.html">PRODUCTOS</a>
      <a href="remitos.html" class="active">REMITOS</a>
      <a href="clientes.html">CLIENTES</a>
    </div>
    <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
  </nav>

<img id="logoRemito" src="logo.webp" style="display:none;">
  <div class="container">
    <h1>B-P Sanitarios</h1>
    <div class="subtitulo">Historial y Gestión de Remitos</div>

    <div class="card-remitos">
      <label class="search-label">Buscar Remito (Nombre o Número):</label>
      <input type="text" id="busquedaRemito" placeholder="Escribe aquí para buscar..." oninput="filtrarRemitos()">
      
      <h3>Listado de Remitos</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nro</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="listaRemitos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtn8b4kpU616tgH56Gw-NDH0o5zLDn48Q",
      authDomain: "bpsanitariossrl.firebaseapp.com",
      databaseURL: "https://bpsanitariossrl-default-rtdb.firebaseio.com",
      projectId: "bpsanitariossrl"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let remitosGlobal = [];

    onAuthStateChanged(auth, user => {
      if(user){
        onValue(ref(db, 'remitos'), snap => {
          const data = snap.val() || {};
          remitosGlobal = Object.entries(data).map(([id, v]) => ({ 
            id: id, 
            numero: v.nroRemito || v.numero || id, 
            ...v 
          })).sort((a,b) => b.numero - a.numero);
          renderRemitos(remitosGlobal);
        });
      } else { window.location.href = "index.html"; }
    });

    function renderRemitos(lista) {
      const tbody = document.getElementById('listaRemitos');
      tbody.innerHTML = lista.map(r => `
        <tr>
          <td><span class="badge-nro">${String(r.numero).padStart(6, '0')}</span></td>
          <td>${r.fecha ? new Date(r.fecha).toLocaleDateString() : 'S/F'}</td>
          <td class="td-cliente">${(r.cliente || "S/N").toUpperCase()}</td>
          <td style="font-weight:bold; color: #d60000;">$${Number(r.total || 0).toLocaleString('es-AR')}</td>
          <td>
            <div style="display: flex; gap: 8px; justify-content: center;">
              <button class="btn-view" onclick="reimprimir('${r.id}')">📄</button>
              <a href="editaremito.html?id=${r.id}" class="btn-edit">✏️</a>
              <button class="btn-anular" onclick="anularRemito('${r.id}')">❌</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    window.filtrarRemitos = () => {
      const txt = document.getElementById('busquedaRemito').value.toLowerCase();
      const filtrados = remitosGlobal.filter(r => 
        (r.cliente || "").toLowerCase().includes(txt) || String(r.numero).includes(txt)
      );
      renderRemitos(filtrados);
    };

    window.anularRemito = async (id) => {
      if(!confirm("¿ANULAR REMITO? Se recuperará el stock.")) return;
      const snap = await get(ref(db, `remitos/${id}`));
      const r = snap.val();
      if(r && r.items) {
        for (const it of r.items) {
          const pRef = ref(db, `stockPorMarca/${it.id}`);
          const pSnap = await get(pRef);
          if(pSnap.exists()) await update(pRef, { cantidad: pSnap.val().cantidad + it.cantidad });
        }
      }
      await remove(ref(db, `remitos/${id}`));
    };

   window.reimprimir = async (id) => {
    const snap = await get(ref(db, `remitos/${id}`));
    const r = snap.val();
    if (!r) return alert("No se encontró el remito");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Obtenemos el elemento de la imagen que precargamos
    const imgLogo = document.getElementById('logoRemito');

    try {
        // Encabezado
        // Usamos imgLogo directamente. jsPDF es capaz de procesar el elemento <img>
        doc.addImage(imgLogo, 'WEBP', 10, 10, 45, 25);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("B-P Distribuidora", 62, 18);

        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text("Humberto Primo 2193, Burzaco", 62, 24);
        doc.text("Tel: 1168136926 / 1126127218", 62, 29);
        doc.text("Email: bpsanitarios@gmail.com", 62, 34);

        const nro = r.nroRemito || r.numero || "000";
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text(`REMITO N°: ${String(nro).padStart(6, '0')}`, 195, 18, { align: "right" });

        doc.setFont("helvetica", "normal");
        doc.text(`Fecha: ${new Date(r.fecha).toLocaleDateString()}`, 195, 25, { align: "right" });

        doc.line(10, 40, 200, 40);

        // --- Datos del Cliente ---
        doc.setFontSize(10);
        doc.text(`CLIENTE: ${(r.cliente || "Consumidor Final").toUpperCase()}`, 10, 48);
        doc.text(`DOMICILIO: ${(r.direccion || "---").toUpperCase()}`, 10, 54);

        // --- Tabla ---
        doc.autoTable({
            startY: 60,
            head: [['Cod.', 'Producto', 'Cant.', 'Precio Unit.', 'Subtotal']],
            body: (r.items || []).map(i => [
                i.codigo,
                i.nombre,
                i.cantidad,
                `$${Number(i.precio).toLocaleString('es-AR')}`,
                `$${(Number(i.cantidad) * Number(i.precio)).toLocaleString('es-AR')}`
            ]),
            headStyles: { fillColor: [255, 43, 43] },
            theme: 'grid'
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFont("helvetica", "bold");
        doc.text(`TOTAL: $${Number(r.total || 0).toLocaleString('es-AR')}`, 195, finalY, { align: "right" });

        doc.save(`Remito_${nro}.pdf`);

    } catch (error) {
        console.error("Error al generar el logo:", error);
        alert("El logo todavía se está cargando o no se encuentra en la carpeta. Intenta de nuevo.");
    }
};

      const finalY = doc.lastAutoTable.finalY + 10;
      doc.setFont("helvetica", "bold"); doc.setFontSize(14);
      doc.text(`TOTAL: $${Number(r.total || 0).toLocaleString('es-AR')}`, 195, finalY, { align: "right" });
      
      doc.save(`Remito_${nro}.pdf`);

    document.getElementById('btnLogout').onclick = () => signOut(auth);
  </script>
</body>
</html>
