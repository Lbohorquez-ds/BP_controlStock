<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Remitos - B-P Sanitarios</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="StyleProductos.css">
  <style>
    #listaRemitos td {
        background-color: white;
        color: #333;
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: center;
    }
    #tablaRemitosHeader th {
        background-color: #ff2b2b;
        color: white;
        padding: 12px;
        text-align: center;
    }
    .btn-anular { background: #ffc107; color: #000; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; }
    .btn-anular:hover { background: #e0a800; }
    
    .btn-edit { background: #28a745; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; display: inline-block; transition: 0.3s; }
    .btn-edit:hover { background: #218838; }

    .btn-view { background: #007bff; color: white; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; }
    .btn-view:hover { background: #0056b3; }
    
    .badge-nro { background: #eee; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; color: #111; }
  </style>
</head>
<body>

  <div id="app">
    <nav class="nav-custom">
      <div class="nav-links">
        <a href="index.html">INICIO</a>
        <a href="productos.html">PRODUCTOS</a>
        <a href="remitos.html" class="active">REMITOS</a>
      </div>
      <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </nav>

    <div class="container">
      <h1>B-P Sanitarios</h1>
      <div class="subtitulo">Historial y Gestión de Remitos</div>

      <div class="card" style="background: white; color: #333;">
        <div style="margin-bottom: 20px;">
          <label style="font-weight: bold; display: block; margin-bottom: 5px;">Buscar Remito (Nombre o Número):</label>
          <input type="text" id="busquedaRemito" placeholder="Ej: 000005 o Juan Pérez..." oninput="filtrarRemitos()" style="width: 100%; border: 1px solid #ccc; padding: 12px; border-radius: 8px;">
        </div>

        <h3>Listado de Remitos</h3>
        <div style="overflow-x:auto">
          <table style="width: 100%; border-collapse: collapse;">
            <thead id="tablaRemitosHeader">
              <tr>
                <th>Nro</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="listaRemitos">
                <tr><td colspan="5">Cargando remitos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtn8b4kpU616tgH56Gw-NDH0o5zLDn48Q",
      authDomain: "bpsanitariossrl.firebaseapp.com",
      databaseURL: "https://bpsanitariossrl-default-rtdb.firebaseio.com",
      projectId: "bpsanitariossrl",
      storageBucket: "bpsanitariossrl.firebasestorage.app",
      messagingSenderId: "761286267293",
      appId: "1:761286267293:web:bfe8bf3e25a9fe22621f74"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let remitosGlobal = [];

    onAuthStateChanged(auth, user => {
      if(user){
        onValue(ref(db, 'remitos'), snap => {
          const data = snap.val() || {};
          remitosGlobal = Object.entries(data).map(([id, v]) => ({ 
            id: id, 
            numero: v.nroRemito || v.numero || id, 
            ...v 
          })).sort((a,b) => b.numero - a.numero);
          filtrarRemitos();
        });
      } else {
        window.location.href = "index.html";
      }
    });

   function renderRemitos(lista) {
  const tbody = document.getElementById('listaRemitos');
  if(lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5">No se encontraron remitos.</td></tr>';
    return;
  }

  tbody.innerHTML = lista.map(r => `
    <tr>
      <td><span class="badge-nro">${String(r.numero).padStart(6, '0')}</span></td>
      <td>${r.fecha ? new Date(r.fecha).toLocaleDateString() : 'S/F'}</td>
      <td><strong>${r.cliente || r.clienteNombre}</strong></td>
      <td>$${(r.total || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
      <td>
        <div style="display: flex; gap: 5px; justify-content: center;">
          <button class="btn-view" onclick="reimprimir('${r.id}')">📄</button>
          <a href="editaremito.html?numero=${r.numero}" class="btn-edit">EDITAR</a>
          <button class="btn-anular" onclick="anularRemito('${r.id}')">ANULAR</button>
        </div>
      </td>
    </tr>
  `).join('');
}

    window.filtrarRemitos = () => {
      const txt = document.getElementById('busquedaRemito').value.toLowerCase();
      if(txt === "") {
        renderRemitos(remitosGlobal.slice(0, 20));
      } else {
        const filtrados = remitosGlobal.filter(r => {
          const nombre = (r.cliente || r.clienteNombre || "").toLowerCase();
          const nro = String(r.numero);
          return nombre.includes(txt) || nro.includes(txt);
        });
        renderRemitos(filtrados);
      }
    };

    window.anularRemito = async (id) => {
      if(!confirm("¿ANULAR ESTE REMITO?\nSe devolverá el stock y se borrará PERMANENTEMENTE de la base de datos.")) return;
      
      try {
        const snap = await get(ref(db, `remitos/${id}`));
        const remito = snap.val();
        
        if(remito && remito.items) {
          // Devolver stock
          for (const item of remito.items) {
            if(item.id) {
              const prodRef = ref(db, `stockPorMarca/${item.id}`);
              const prodSnap = await get(prodRef);
              if(prodSnap.exists()) {
                const stockActual = prodSnap.val().cantidad || 0;
                await update(prodRef, { cantidad: stockActual + item.cantidad });
              }
            }
          }
        }
        
        // BORRAR DE LA BASE DE DATOS
        await remove(ref(db, `remitos/${id}`));
        alert("✅ Remito eliminado y stock recuperado.");
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    window.reimprimir = async (id) => {
      try {
        const snap = await get(ref(db, `remitos/${id}`));
        const r = snap.val();
        if(!r) return alert("No se encontró el remito.");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Cabecera igual a crearremito
        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text("B-P Distribuidora", 15, 20);
        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text("Humberto Primo 2193, Burzaco", 15, 26);
        doc.text("Tel: 1168136926 / 1126127218", 15, 31);
        doc.text("Email: bpsanitarios@gmail.com", 15, 36);

        doc.text(`REMITO N°: ${String(r.nroRemito || r.numero || id).padStart(6, '0')}`, 140, 20);
        doc.text(`Fecha: ${new Date(r.fecha).toLocaleDateString()}`, 140, 26);
        doc.line(15, 40, 195, 40);

        doc.text(`CLIENTE: ${(r.cliente || r.clienteNombre).toUpperCase()}`, 15, 50);
        doc.text(`DOMICILIO: ${(r.direccion || r.clienteDireccion || "N/C").toUpperCase()}`, 15, 56);

        const filas = (r.items || []).map(i => [
          i.codigo, 
          i.nombre, 
          i.cantidad, 
          `$${i.precio.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`, 
          `$${(i.cantidad * i.precio).toLocaleString('es-AR')}`
        ]);
        
        doc.autoTable({
          startY: 65,
          head: [['COD.', 'PRODUCTO', 'CANT.', 'UNIT.', 'SUBTOTAL']],
          body: filas,
          theme: 'striped',
          headStyles: { fillColor: [255, 43, 43] }
        });

        const finalY = doc.lastAutoTable.finalY + 15;
        doc.setFontSize(14);
        const total = r.total || r.totalEditado || 0;
        doc.text(`TOTAL GENERAL: $${total.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`, 195, finalY, { align: "right" });

        doc.save(`Remito_${r.nroRemito || id}.pdf`);
      } catch (err) {
        alert("Error al generar PDF: " + err.message);
      }
    };

    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
