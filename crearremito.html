<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Remito - B-P Sanitarios</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="StyleProductos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    .sugerencias-box {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white; color: black; z-index: 1000;
      border: 1px solid #ccc; border-radius: 0 0 8px 8px;
      max-height: 180px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .sugerencia-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; }
    .sugerencia-item:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <nav class="nav-custom">
    <div class="nav-links">
      <a href="index.html">INICIO</a>
      <a href="productos.html">PRODUCTOS</a>
      <a href="remitos.html">REMITOS</a>
      <a href="clientes.html">CLIENTES</a>
    </div>
  </nav>

  <div class="container">
    <h1>Crear Nuevo Remito</h1>
    <p class="subtitulo">B-P SANITARIOS - Distribuidora</p>

    <div class="card">
      <h3 style="color:white; border-bottom: 2px solid #ff2b2b; display:inline-block; margin-bottom:15px;">DATOS DEL CLIENTE</h3>
      <div class="grid" style="position:relative;">
        <input type="text" id="inputCliente" placeholder="Buscar cliente por nombre..." autocomplete="off">
        <div id="sugerenciasCliente" class="sugerencias-box" style="display:none;"></div>
        <input type="text" id="inputDireccion" placeholder="Dirección (se completa solo)" readonly>
      </div>
    </div>

    <div class="card">
      <h3 style="color:white; border-bottom: 2px solid #ff2b2b; display:inline-block; margin-bottom:15px;">AGREGAR PRODUCTOS</h3>
      <div class="grid" style="position:relative;">
        <input type="text" id="inputProducto" placeholder="Buscar producto por código o nombre..." autocomplete="off">
        <div id="sugerenciasProducto" class="sugerencias-box" style="display:none;"></div>
        <input type="number" id="inputCantidad" placeholder="Cant." style="width:100px;">
        <button class="btn-primary" onclick="agregarAlRemito()">Añadir</button>
      </div>
    </div>

    <div class="card" style="background: white;">
      <table id="tablaRemito">
        <thead style="background: #222; color: white;">
          <tr>
            <th>CÓDIGO</th>
            <th>PRODUCTO</th>
            <th>CANT.</th>
            <th>PRECIO UNIT.</th>
            <th>SUBTOTAL</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="cuerpoRemito" style="color: #333;">
          </tbody>
      </table>
      
      <div style="text-align: right; margin-top: 20px; font-size: 24px; color: #111;">
        <strong>TOTAL: $ <span id="totalRemito">0</span></strong>
      </div>
    </div>

    <div style="margin-top:20px; display:flex; gap:15px; justify-content: flex-end;">
      <button class="btn-primary" style="background:#555;" onclick="window.location.href='index.html'">Cancelar</button>
      <button class="btn-primary" onclick="confirmarRemito()">Finalizar e Imprimir</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, get, set, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const firebaseConfig = {
      // Tu configuración de Firebase aquí
      databaseURL: "https://bpsanitarios-default-rtdb.firebaseio.com" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let clientes = [];
    let productos = [];
    const inputCli = document.getElementById('inputCliente');
    const inputDir = document.getElementById('inputDireccion');
    const sugCli = document.getElementById('sugerenciasCliente');
    const inputProd = document.getElementById('inputProducto');
    const sugProd = document.getElementById('sugerenciasProducto');
    const inputCant = document.getElementById('inputCantidad');
    const cuerpoRemito = document.getElementById('cuerpoRemito');
    const divTotal = document.getElementById('totalRemito');

    let itemSeleccionado = null;

    // CARGAR DATOS
    onValue(ref(db, 'clientes'), snap => {
      const data = snap.val();
      clientes = data ? Object.entries(data).map(([id,v]) => ({id,...v})) : [];
    });

    onValue(ref(db, 'stockPorMarca'), snap => {
      const data = snap.val();
      productos = data ? Object.entries(data).map(([id,v]) => ({id,...v})) : [];
    });

    // BUSCADOR CLIENTES
    inputCli.oninput = () => {
      const txt = inputCli.value.toLowerCase();
      sugCli.innerHTML = '';
      if(!txt) { sugCli.style.display='none'; return; }
      const filtrados = clientes.filter(c => c.nombre.toLowerCase().includes(txt));
      filtrados.forEach(c => {
        const d = document.createElement('div');
        d.className = 'sugerencia-item';
        d.textContent = c.nombre;
        d.onclick = () => {
          inputCli.value = c.nombre;
          inputDir.value = c.direccion;
          localStorage.setItem('cliente', c.nombre);
          localStorage.setItem('direccion', c.direccion);
          sugCli.style.display = 'none';
        };
        sugCli.appendChild(d);
      });
      sugCli.style.display = filtrados.length ? 'block' : 'none';
    };

    // BUSCADOR PRODUCTOS
    inputProd.oninput = () => {
      const txt = inputProd.value.toLowerCase();
      sugProd.innerHTML = '';
      if(!txt) { sugProd.style.display='none'; return; }
      const filtrados = productos.filter(p => p.codigo.toLowerCase().includes(txt) || p.nombre.toLowerCase().includes(txt));
      filtrados.forEach(p => {
        const d = document.createElement('div');
        d.className = 'sugerencia-item';
        d.textContent = `(${p.codigo}) ${p.nombre} - $${p.precio}`;
        d.onclick = () => {
          inputProd.value = p.nombre;
          itemSeleccionado = p;
          sugProd.style.display = 'none';
          inputCant.focus();
        };
        sugProd.appendChild(d);
      });
      sugProd.style.display = filtrados.length ? 'block' : 'none';
    };

    window.agregarAlRemito = () => {
      const cant = parseInt(inputCant.value);
      if(!itemSeleccionado || isNaN(cant) || cant <= 0) return;
      
      const subtotal = cant * itemSeleccionado.precio;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${itemSeleccionado.codigo}</td>
        <td>${itemSeleccionado.nombre}</td>
        <td>${cant}</td>
        <td>${itemSeleccionado.precio}</td>
        <td>${subtotal}</td>
        <td><button class="btn-delete-mode" onclick="this.parentElement.parentElement.remove(); actualizarTotal();">X</button></td>
      `;
      cuerpoRemito.appendChild(tr);
      actualizarTotal();
      
      inputProd.value = '';
      inputCant.value = '';
      itemSeleccionado = null;
    };

    window.actualizarTotal = () => {
      let t = 0;
      cuerpoRemito.querySelectorAll('tr').forEach(row => {
        t += parseFloat(row.cells[4].textContent);
      });
      divTotal.textContent = t.toLocaleString('es-AR');
    };

    // BOTÓN FINALIZAR
    window.confirmarRemito = async () => {
      try {
        // 1. OBTENER NRO REMITO (Seguro)
        const nroRef = ref(db, 'ultimoRemito');
        const nroS = await get(nroRef);
        let nroActual = nroS.val() || 0;

        // Respaldo: chequear el nro más alto en la lista real
        const remitosRef = ref(db, 'remitos');
        const qUltimo = query(remitosRef, orderByChild('nroRemito'), limitToLast(1));
        const snapUltimo = await get(qUltimo);
        let nroEnLista = 0;
        if(snapUltimo.exists()){
            const data = Object.values(snapUltimo.val())[0];
            nroEnLista = data.nroRemito || 0;
        }

        const nroFinal = Math.max(nroActual, nroEnLista) + 1;

        // 2. CREAR OBJETO
        const r = {
          nroRemito: nroFinal,
          fecha: new Date().toISOString(),
          cliente: inputCli.value,
          direccion: inputDir.value,
          items: [],
          total: parseFloat(divTotal.textContent.replace(/\./g, '').replace(',', '.'))
        };

        if(!r.cliente || cuerpoRemito.rows.length === 0) {
          Swal.fire('Error', 'Completa cliente y productos', 'error');
          return;
        }

        cuerpoRemito.querySelectorAll('tr').forEach(row => {
          r.items.push({
            codigo: row.cells[0].textContent,
            nombre: row.cells[1].textContent,
            cantidad: parseInt(row.cells[2].textContent),
            precio: parseFloat(row.cells[3].textContent)
          });
        });

        // 3. GUARDAR
        await push(ref(db, 'remitos'), r);
        await set(ref(db, 'ultimoRemito'), nroFinal);

        await Swal.fire('Guardado', `Remito N° ${nroFinal} generado.`, 'success');
        imprimir(r);
        location.reload();

      } catch (e) {
        Swal.fire('Error', e.message, 'error');
      }
    };

    function imprimir(r) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      const logoBase64 = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAAtAFADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4X3qDhIWGh4iJipKTlJWWl5iZmqjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSEUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4X3q19kZG50Zm5uY2R8fX53c3R1dnd4X3q5err69v7u7n9upt3mx8vP09fb3+Pn6/9oADAMAMAMAMAMAMAMAHBf8+fXpUeaKKBXHY9z7UhGBkZPPeiigBtFFFADfX2PFSjpRRSZURPrS0UUhifpSj/AD+VFFNAH/1+1FFFIY09//rV//Z";

      // Logo e Info de Empresa
      doc.addImage(logoBase64, 'JPEG', 15, 10, 40, 20); 
      doc.setFontSize(16); doc.setFont("helvetica", "bold");
      doc.text("B-P Distribuidora", 60, 18);
      
      doc.setFontSize(10); doc.setFont("helvetica", "normal");
      doc.text("Humberto Primo 2193, Burzaco", 60, 24);
      doc.text("Tel: 1168136926 / 1126127218", 60, 29);
      doc.text("Email: bpsanitarios@gmail.com", 60, 34);
      
      // Datos Remito
      doc.setFontSize(11);
      doc.text(`REMITO N°: ${String(r.nroRemito).padStart(6, '0')}`, 140, 20);
      doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 140, 26);
      doc.line(15, 40, 195, 40);

      doc.text(`CLIENTE: ${r.cliente.toUpperCase()}`, 15, 48);
      doc.text(`DOMICILIO: ${r.direccion.toUpperCase()}`, 15, 54);

      // Tabla
      doc.autoTable({
        startY: 62,
        head: [['COD.', 'PRODUCTO', 'CANT.', 'UNIT.', 'TOTAL']],
        body: r.items.map(i => [
          i.codigo, 
          i.nombre, 
          i.cantidad, 
          `$${Number(i.precio).toLocaleString('es-AR', {minimumFractionDigits:2})}`, 
          `$${(i.cantidad * i.precio).toLocaleString('es-AR', {minimumFractionDigits:2})}`
        ]),
        theme: 'striped',
        headStyles: { fillColor: [255, 43, 43] }
      });

      const finalY = doc.lastAutoTable.finalY + 15;
      doc.setFontSize(14); doc.setFont("helvetica", "bold");
      doc.text(`TOTAL: $${r.total.toLocaleString('es-AR', {minimumFractionDigits:2})}`, 195, finalY, { align: "right" });
      
      doc.save(`Remito_${r.nroRemito}_${r.cliente}.pdf`);
    }
  </script>
</body>
</html>
