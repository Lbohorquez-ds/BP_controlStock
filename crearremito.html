<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Remito - B-P Sanitarios</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="StyleProductos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    .sugerencias-box {
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0;
      background: white; 
      color: black; 
      z-index: 1000;
      border: 1px solid #ccc; 
      border-radius: 0 0 8px 8px;
      max-height: 180px; 
      overflow-y: auto; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .sugerencia-item { 
      padding: 10px; 
      cursor: pointer; 
      border-bottom: 1px solid #eee; 
      text-align: left; 
    }
    .sugerencia-item:hover { 
      background: #ff2b2b; 
      color: white; 
    }
    input { background: white !important; color: black !important; }
    label { color: #bbb; font-weight: bold; font-size: 12px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>
  <nav class="nav-custom">
    <div class="nav-links">
      <a href="index.html">INICIO</a>
      <a href="productos.html">PRODUCTOS</a>
      <a href="remitos.html">REMITOS</a>
      <a href="clientes.html">CLIENTES</a>
    </div>
  </nav>

    <img id="logoRemito" src="logo.webp" style="display:none;">
    
  <div class="container">
    <h1>B-P Sanitarios</h1>
    <div class="subtitulo">Generación de Remito Oficial</div>

    <div class="card">
      <h3 style="color:white; border-bottom: 2px solid #ff2b2b; display:inline-block; margin-bottom:15px;">Datos del Cliente</h3>
      <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div style="position: relative;">
          <label>Nombre o Razón Social</label>
          <input type="text" id="clienteNombre" oninput="buscar()" placeholder="Escribí para buscar..." autocomplete="off">
          <div id="boxSug" class="sugerencias-box" style="display:none"></div>
        </div>
        <div>
          <label>Dirección</label>
          <input type="text" id="clienteDir" placeholder="Dirección de entrega">
        </div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden; background:white;">
      <table style="width:100%; border-collapse:collapse; color:black;">
        <thead style="background:#ff2b2b; color:white;">
          <tr><th style="padding:12px;">Cod.</th><th>Producto</th><th>Cant.</th><th>Unit.</th><th>Subtotal</th></tr>
        </thead>
        <tbody id="tbodyR"></tbody>
      </table>
      <div id="totalFinal" style="background:#111; color:white; padding:20px; text-align:right; font-size:24px; font-weight:bold;">Total: $0</div>
    </div>

    <div style="display:flex; gap:15px; justify-content:flex-end; margin-top:20px;">
      <button class="btn-secondary" onclick="window.location.href='productos.html'">Volver al Stock</button>
      <button class="btn-primary" onclick="procesarRemito()" style="background:#28a745; padding:15px 30px;">CONFIRMAR E IMPRIMIR</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const config = {
      apiKey: "AIzaSyCtn8b4kpU616tgH56Gw-NDH0o5zLDn48Q",
      authDomain: "bpsanitariossrl.firebaseapp.com",
      databaseURL: "https://bpsanitariossrl-default-rtdb.firebaseio.com",
      projectId: "bpsanitariossrl"
    };
    const app = initializeApp(config);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let carrito = JSON.parse(localStorage.getItem('bp_carrito')) || [];
    let clientesDB = [];

    onAuthStateChanged(auth, u => {
      if(u) {
        onValue(ref(db, 'clientes'), s => {
          const d = s.val();
          clientesDB = d ? Object.values(d) : [];
        });
        render();
      } else window.location.href="index.html";
    });

    window.buscar = () => {
      const val = document.getElementById('clienteNombre').value.toLowerCase();
      const box = document.getElementById('boxSug');
      if(val.length < 2) { box.style.display='none'; return; }
      const fil = clientesDB.filter(c => c.nombre.toLowerCase().includes(val));
      box.style.display = fil.length ? 'block' : 'none';
      box.innerHTML = fil.map(c => `<div class="sugerencia-item" onclick="sel('${c.nombre}','${c.direccion}')"><strong>${c.nombre}</strong><br><small>${c.direccion}</small></div>`).join('');
    };

    window.sel = (n, d) => {
      document.getElementById('clienteNombre').value = n;
      document.getElementById('clienteDir').value = d;
      document.getElementById('boxSug').style.display='none';
    };

    function render() {
      let t = 0;
      document.getElementById('tbodyR').innerHTML = carrito.map(i => {
        const sub = i.cantidad * i.precio; t += sub;
        return `<tr style="border-bottom:1px solid #eee;"><td style="padding:10px; text-align:center;">${i.codigo}</td><td>${i.nombre}</td><td style="text-align:center;">${i.cantidad}</td><td style="text-align:center;">$${i.precio}</td><td style="text-align:center; font-weight:bold;">$${sub}</td></tr>`;
      }).join('');
      document.getElementById('totalFinal').innerText = `Total: $${t.toLocaleString('es-AR')}`;
    }

    window.procesarRemito = async () => {
      const n = document.getElementById('clienteNombre').value.trim();
      const d = document.getElementById('clienteDir').value.trim();
      if(!n || !d || !carrito.length) return alert("Faltan datos o el carrito está vacío");

      const existe = clientesDB.some(c => c.nombre.toLowerCase() === n.toLowerCase());
      if(!existe) await push(ref(db, 'clientes'), { nombre: n, direccion: d });

      const nroS = await get(ref(db, 'ultimoRemito'));
      const nro = (nroS.val() || 0) + 1;
      const total = carrito.reduce((s, i) => s + (i.cantidad * i.precio), 0);
      const remito = { nroRemito: nro, cliente: n, direccion: d, items: carrito, total, fecha: new Date().toISOString() };
      
      await push(ref(db, 'remitos'), remito);
      await set(ref(db, 'ultimoRemito'), nro);

      for(const item of carrito) {
        const pRef = ref(db, `stockPorMarca/${item.id}`);
        const pS = await get(pRef);
        if(pS.exists()) await update(pRef, { cantidad: pS.val().cantidad - item.cantidad });
      }

      imprimir(remito);
      localStorage.removeItem('bp_carrito');
      window.location.href="remitos.html";
    };

  function imprimir(r) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Obtenemos el elemento de la imagen precargada
    const imgLogo = document.getElementById('logoRemito');

    // 1. ENCABEZADO
    try {
        // Si la imagen existe y cargó, la usamos
        if (imgLogo && imgLogo.complete) {
            // Sintaxis: addImage(elemento, formato, x, y, ancho, alto)
            doc.addImage(imgLogo, 'WEBP', 10, 10, 45, 25); 
        }
    } catch (e) { 
        console.error("Error al insertar logo:", e); 
    }

    doc.setFontSize(18); 
    doc.setFont("helvetica", "bold");
    doc.text("B-P Distribuidora", 62, 18);
    
    doc.setFontSize(9); 
    doc.setFont("helvetica", "normal");
    doc.text("Humberto Primo 2193, Burzaco", 62, 24);
    doc.text("Tel: 1168136926 / 1126127218", 62, 29);
    doc.text("Email: bpsanitarios@gmail.com", 62, 34);
    
    const nro = r.nroRemito || "000000";
    const fecha = new Date().toLocaleDateString();

    doc.setFontSize(11); 
    doc.setFont("helvetica", "bold");
    doc.text(`REMITO N°: ${String(nro).padStart(6, '0')}`, 195, 18, { align: "right" });
    
    doc.setFontSize(10); 
    doc.setFont("helvetica", "normal");
    doc.text(`Fecha: ${fecha}`, 195, 25, { align: "right" });
    
    doc.line(10, 40, 200, 40);

    // 2. DATOS DEL CLIENTE
    doc.setFontSize(10); 
    doc.setFont("helvetica", "bold");
    doc.text("CLIENTE:", 10, 48);
    doc.setFont("helvetica", "normal");
    doc.text(String(r.cliente || "Consumidor Final").toUpperCase(), 35, 48);

    doc.setFont("helvetica", "bold");
    doc.text("DOMICILIO:", 10, 54);
    doc.setFont("helvetica", "normal");
    doc.text(String(r.direccion || "---").toUpperCase(), 35, 54);

    // 3. TABLA DE PRODUCTOS
    doc.autoTable({ 
      startY: 60, 
      head: [['Cod.', 'Producto', 'Cant.', 'Precio Unit.', 'Subtotal']], 
      body: r.items.map(i => [
        i.codigo, 
        i.nombre, 
        i.cantidad, 
        `$${Number(i.precio).toLocaleString('es-AR')}`, 
        `$${(i.cantidad * i.precio).toLocaleString('es-AR')}`
      ]), 
      headStyles: { fillColor: [255, 43, 43], textColor: [255, 255, 255], fontStyle: 'bold' },
      theme: 'grid',
      styles: { fontSize: 9 }
    });

    // 4. TOTAL
    const finalY = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(14); 
    doc.setFont("helvetica", "bold");
    doc.text(`TOTAL: $${Number(r.total).toLocaleString('es-AR')}`, 195, finalY, { align: "right" });

    doc.save(`Remito_${nro}.pdf`);
  }
  </script>
</body>
</html>
