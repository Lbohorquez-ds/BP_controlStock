<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos - B-P Sanitarios</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="StyleProductos.css">
  <style>
    .container { max-width: 100%; padding: 10px; }
    
    #tablaStockCompleta th, #tablaStockCompleta td,
    #tablaCarrito th, #tablaCarrito td { 
        padding: 10px 4px; 
        font-size: 13px; 
        text-align: center;
        vertical-align: middle;
    }

    .edit-input-table {
        border: 1px solid transparent !important;
        padding: 4px !important;
        height: 38px !important; 
        font-size: 13px !important;
        background: transparent !important;
        text-align: center;
        border-radius: 6px;
        transition: 0.2s;
        margin: 0 !important;
    }

    .editable-active {
        border: 1px solid #ccc !important;
        background: #fff !important;
    }

    table { table-layout: fixed; width: 100%; border-collapse: collapse; background: white; }
    th:nth-child(1) { width: 80px; }  
    th:nth-child(2) { width: 85px; }  
    th:nth-child(3) { width: 32%; } 
    th:nth-child(4) { width: 70px; }  
    th:nth-child(5) { width: 130px; } 
    th:nth-child(6) { width: 120px; } 
    th:nth-child(7) { width: 110px; } 
    th:nth-child(8) { width: 155px; } 

    .stock-val { font-size: 16px; font-weight: bold; color: #111; display: block; }
    
    .row-actions { display: flex; gap: 5px; justify-content: center; align-items: center; height: 38px; }

    .btn-action { 
        height: 38px; width: 38px; 
        display: flex; align-items: center; justify-content: center; 
        border-radius: 6px; font-size: 16px; border: none; cursor: pointer;
    }
    .btn-edit-mode { background: #4a4a4a; color: white; }
    .btn-save-mode { background: #28a745; color: white; }
    .btn-delete-mode { background: #dc3545; color: white; }
    
    .btn-stock { 
        height: 38px; width: 35px; background: #333; color: white; 
        border: none; font-weight: bold; cursor: pointer; border-radius: 4px;
    }

    .btn-adjuntar {
        background: #28a745; color: white; border: none; padding: 0 8px;
        height: 38px; border-radius: 6px; font-weight: bold; font-size: 10px;
        text-transform: uppercase; cursor: pointer; width: 100%;
    }

    .chip { padding: 4px 10px; font-size: 11px; background: #f0f0f0; border-radius: 4px; font-weight: bold; }
    .currency-symbol { font-weight: bold; margin-right: 2px; }
  </style>
</head>
<body>

  <div id="app">
    <nav class="nav-custom">
      <div class="nav-links">
        <a href="index.html">INICIO</a>
        <a href="productos.html" class="active">PRODUCTOS</a>
        <a href="remitos.html">REMITOS</a>
        <a href="clientes.html">CLIENTES</a>
      </div>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>

    <div class="container">
      <h1>B-P Sanitarios</h1>
      <div class="subtitulo">Gestión de Inventario</div>

      <div class="card">
        <h2 style="color: white;">Añadir Producto</h2>
        <div class="grid">
          <input type="text" id="codigo" placeholder="Código">
          <select id="marca">
            <option value="">Marca...</option>
            <option value="Bonomini">Bonomini</option>
            <option value="Dealer">Dealer</option>
            <option value="Duke">Duke</option>
            <option value="Egoplast">Egoplast</option>
            <option value="Faplas">Faplas</option>
            <option value="Fusiogas">Fusiogas</option>
            <option value="Redeco">Redeco</option>
            <option value="TF3">TF3</option>
            <option value="Propileno">Propileno</option>
            <option value="PVC">PVC</option>
            <option value="Polietileno">Polietileno (N)</option>
            <option value="Otros">Otros</option>
          </select>
          <input type="text" id="nombre" placeholder="Nombre">
          <input type="number" id="cantidad" placeholder="Stock Inicial" min="0">
          <input type="number" id="precio" placeholder="Precio" step="0.01" min="0">
        </div>
        <button class="btn-primary" style="margin-top:15px" onclick="agregarProducto()">Guardar Producto</button>
      </div>

      <div class="card">
        <h2 style="color: white;">Stock Actual</h2>
        <input type="text" id="busqueda" placeholder="Buscar producto o código..." oninput="renderTabla()" style="margin-bottom:15px">
        
        <div class="tabs" id="tabMarcas">
            <button class="tab active" onclick="cambiarMarca('Todas', this)">Todas</button>
            <button class="tab" onclick="cambiarMarca('Bonomini', this)">Bonomini</button>
            <button class="tab" onclick="cambiarMarca('Dealer', this)">Dealer</button>
            <button class="tab" onclick="cambiarMarca('Duke', this)">Duke</button>
            <button class="tab" onclick="cambiarMarca('Egoplast', this)">Egoplast</button>
            <button class="tab" onclick="cambiarMarca('Faplas', this)">Faplas</button>
            <button class="tab" onclick="cambiarMarca('Fusiogas', this)">Fusiogas</button>
            <button class="tab" onclick="cambiarMarca('Redeco', this)">Redeco</button>
            <button class="tab" onclick="cambiarMarca('TF3', this)">TF3</button>
            <button class="tab" onclick="cambiarMarca('Propileno', this)">Propileno</button>
            <button class="tab" onclick="cambiarMarca('PVC', this)">PVC</button>
            <button class="tab" onclick="cambiarMarca('Polietileno', this)">Polietileno(N)</button>
          <button class="tab" onclick="cambiarMarca('Otros', this)">Otros</button>
          </div>          

        <div style="overflow-x:auto">
          <table id="tablaStockCompleta">
            <thead>
              <tr style="background: #ff2b2b; color: white;">
                <th>Cod.</th>
                <th>Marca</th>
                <th>Descripción</th>
                <th>Stock</th>
                <th>+/- Stock</th>
                <th>Precio</th>
                <th>Acción</th>
                <th>Carrito</th>
              </tr>
            </thead>
            <tbody id="tablaStock"></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="border-top: 4px solid #ff2b2b; padding: 0; overflow: hidden; margin-top: 20px;">
        <h2 style="padding: 20px; margin: 0; background: #1b1b1b; color: white;">Carrito actual</h2>
        <div style="overflow-x:auto">
          <table id="tablaCarrito" style="width: 100%; border-collapse: collapse; background: white; color: #333;">
           <thead style="background: #ff2b2b; color: white;">
              <tr>
                <th>Cantidad</th> 
                <th>Código</th>
                <th>Descripción</th>
                <th>Unitario</th>
                <th>Total</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyCarrito"></tbody>
          </table>
        </div>
        <div style="background: #111; color: white; text-align: right; padding: 15px; font-weight: bold; font-size: 20px;">
            Total general: <span id="totalCarrito">$0,00</span>
        </div>
        <div style="text-align:right; padding: 15px; background: #1b1b1b; display: flex; justify-content: flex-end; gap: 10px;">
          <button class="btn-secondary" onclick="vaciarCarrito()">Vaciar Carrito</button>
          <a href="crearremito.html"><button class="btn-success">Hacer Remito</button></a>
        </div>
      </div>

      <div id="mensaje" class="mensaje"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtn8b4kpU616tgH56Gw-NDH0o5zLDn48Q",
      authDomain: "bpsanitariossrl.firebaseapp.com",
      databaseURL: "https://bpsanitariossrl-default-rtdb.firebaseio.com",
      projectId: "bpsanitariossrl",
      storageBucket: "bpsanitariossrl.firebasestorage.app",
      messagingSenderId: "761286267293",
      appId: "1:761286267293:web:bfe8bf3e25a9fe22621f74"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const productosRef = ref(db, 'stockPorMarca');

    let productos = [];
    let carrito = JSON.parse(localStorage.getItem('bp_carrito')) || [];
    let marcaFiltro = 'Todas';

    window.agregarProducto = async () => {
      const codigo = document.getElementById('codigo').value.trim();
      const marca = document.getElementById('marca').value;
      const nombre = document.getElementById('nombre').value.trim();
      const cantidad = Math.max(0, Number(document.getElementById('cantidad').value));
      const precio = Math.max(0, parseFloat(document.getElementById('precio').value)) || 0;

      if(!codigo || !marca || !nombre){ alert("⚠️ Faltan datos"); return; }
      if(productos.some(p => (p.codigo||"").toLowerCase() === codigo.toLowerCase())){ alert("❌ Código duplicado"); return; }

      await push(productosRef, { codigo, marca, nombre, cantidad, precio });
      mostrarMsg("✅ Producto Guardado");
      document.querySelectorAll('.card input, .card select').forEach(i => i.value = '');
    };

    window.renderTabla = () => {
      const busc = document.getElementById('busqueda').value.toLowerCase();
      const tbody = document.getElementById('tablaStock');
      const filtrados = productos.filter(p => 
        (marcaFiltro === 'Todas' || p.marca === marcaFiltro) &&
        ((p.nombre || "").toLowerCase().includes(busc) || (p.codigo || "").toLowerCase().includes(busc))
      );

      tbody.innerHTML = filtrados.map(p => `
        <tr id="row-${p.id}">
          <td><input type="text" id="cod-${p.id}" value="${p.codigo}" class="edit-input-table input-editable" disabled style="width:100%"></td>
          <td><span class="chip">${p.marca}</span></td>
          <td><input type="text" id="nom-${p.id}" value="${p.nombre}" class="edit-input-table input-editable" disabled style="width:100%; text-align:left; padding-left:10px !important;"></td>
          <td><span class="stock-val">${p.cantidad}</span></td>
          <td>
            <div class="row-actions">
              <input type="number" id="mov-${p.id}" class="edit-input-table editable-active" style="width:45px" placeholder="0" min="0">
              <button class="btn-stock" onclick="sumarStock('${p.id}')">+</button>
              <button class="btn-stock" onclick="restarStock('${p.id}')">-</button>
            </div>
          </td>
          <td>
             <div class="row-actions">
                <span class="currency-symbol">$</span>
                <input type="number" id="pre-${p.id}" value="${Number(p.precio).toFixed(2)}" class="edit-input-table input-editable" disabled style="width:85px; text-align:right" min="0">
             </div>
          </td>
          <td>
            <div class="row-actions">
                <button class="btn-action btn-edit-mode btn-toggle-edit" onclick="toggleEdicion('${p.id}')">✏️</button>
                <button class="btn-action btn-delete-mode btn-delete-row" onclick="borrarProducto('${p.id}')" style="display:none">❌</button>
            </div>
          </td>
          <td>
            <div class="row-actions">
              <input type="number" id="cart-${p.id}" class="edit-input-table editable-active" style="width:45px" placeholder="0" min="1">
              <button class="btn-adjuntar" onclick="agregarCarrito('${p.id}')">Adjuntar</button>
            </div>
          </td>
        </tr>
      `).join('');
    };

    window.toggleEdicion = (id) => {
        const fila = document.getElementById(`row-${id}`);
        const inputs = fila.querySelectorAll('.input-editable');
        const btnMain = fila.querySelector('.btn-toggle-edit');
        const btnDel = fila.querySelector('.btn-delete-row');
        const editando = fila.classList.toggle('is-editing');

        inputs.forEach(input => {
            input.disabled = !editando;
            input.classList.toggle('editable-active', editando);
        });

        if (editando) {
            btnMain.innerHTML = '✅';
            btnMain.className = 'btn-action btn-save-mode btn-toggle-edit';
            btnDel.style.display = 'flex';
        } else {
            btnMain.innerHTML = '✏️';
            btnMain.className = 'btn-action btn-edit-mode btn-toggle-edit';
            btnDel.style.display = 'none';
            guardarFila(id);
        }
    };

    async function guardarFila(id) {
        const codigo = document.getElementById(`cod-${id}`).value.trim();
        const nombre = document.getElementById(`nom-${id}`).value.trim();
        const precio = Math.max(0, parseFloat(document.getElementById(`pre-${id}`).value)) || 0;
        await update(ref(db, `stockPorMarca/${id}`), { codigo, nombre, precio });
        mostrarMsg("✅ Cambios Guardados");
    }

    window.sumarStock = (id) => {
      const p = productos.find(x => x.id === id);
      const v = Math.max(0, Number(document.getElementById(`mov-${id}`).value));
      if(v > 0) update(ref(db, `stockPorMarca/${id}`), { cantidad: (p.cantidad||0) + v });
      document.getElementById(`mov-${id}`).value = '';
    };

    window.restarStock = (id) => {
      const p = productos.find(x => x.id === id);
      const v = Math.max(0, Number(document.getElementById(`mov-${id}`).value));
      if(v > 0) {
          const nuevaCant = Math.max(0, p.cantidad - v);
          update(ref(db, `stockPorMarca/${id}`), { cantidad: nuevaCant });
      }
      document.getElementById(`mov-${id}`).value = '';
    };

    window.borrarProducto = async (id) => {
        if(confirm("¿Eliminar este producto?")) { await remove(ref(db, `stockPorMarca/${id}`)); mostrarMsg("🗑️ Eliminado"); }
    };

    window.agregarCarrito = (id) => {
      const p = productos.find(x => x.id === id);
      const cantInput = document.getElementById(`cart-${id}`);
      const cantAñadir = Math.max(0, Number(cantInput.value));
      if(cantAñadir <= 0) return;
      const enCarrito = carrito.find(c => c.id === id);
      const actual = enCarrito ? enCarrito.cantidad : 0;
      if((actual + cantAñadir) > p.cantidad) return alert(`❌ Stock insuficiente.`);
      
      if(enCarrito) enCarrito.cantidad += cantAñadir;
      else carrito.push({ id: p.id, codigo: p.codigo, nombre: p.nombre, precio: p.precio, cantidad: cantAñadir });
      
      localStorage.setItem('bp_carrito', JSON.stringify(carrito));
      cantInput.value = '';
      renderCarrito();
      mostrarMsg("🛒 Añadido");
    };

    window.vaciarCarrito = () => { if(confirm("¿Vaciar?")){ carrito=[]; localStorage.removeItem('bp_carrito'); renderCarrito(); }};
    
    window.eliminarItemCarrito = (idx) => {
      carrito.splice(idx, 1);
      localStorage.setItem('bp_carrito', JSON.stringify(carrito));
      renderCarrito();
    };

    function renderCarrito() {
      const tbody = document.getElementById('tbodyCarrito');
      let t = 0;
      if (carrito.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center;">Carrito vacío</td></tr>';
        document.getElementById('totalCarrito').textContent = `$0,00`;
        return;
      }
      tbody.innerHTML = carrito.map((c, i) => {
        const sub = c.cantidad * c.precio;
        t += sub;
        return `<tr>
          <td style="text-align:center;">${c.cantidad}</td>
          <td style="text-align:center;">${c.codigo}</td>
          <td style="text-align:center;">${c.nombre}</td>
          <td style="text-align:center;">$${Number(c.precio).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td style="text-align:center;">$${sub.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td style="text-align:center;"><button class="btn-delete-mode btn-small" onclick="eliminarItemCarrito(${i})">X</button></td>
        </tr>`;
      }).join('');
      document.getElementById('totalCarrito').textContent = `$${t.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function mostrarMsg(t) {
        const e = document.getElementById('mensaje');
        e.textContent = t; e.style.display = "block";
        setTimeout(() => e.style.display = "none", 2000);
    }

    window.cambiarMarca = (m, b) => {
      marcaFiltro = m;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      renderTabla();
    };

    onAuthStateChanged(auth, user => {
      if(user){
        onValue(productosRef, snap => {
          const data = snap.val();
          productos = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
          renderTabla();
          renderCarrito();
        });
      } else { window.location.href = "index.html"; }
    });

    window.cerrarSesion = () => signOut(auth).then(() => window.location.href = "index.html");
  </script>
</body>
</html>
